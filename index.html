
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c19">
  <meta name="description" content="DevCode: desarrollo de páginas web, aplicaciones y soluciones digitales. Próximamente.">

  <title>DevCode | Próximamente</title>

  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="container">
    <section class="coming-soon">

      <div class="logo-container">
        <img
          src="./logo.svg"
          alt="Logotipo de DevCode"
          class="logo"
          width="100"
          height="100"
        >
      </div>

      <h1 class="brand">Dev<span>Code</span></h1>

      <div class="status">
        <span class="status-dot"></span>
        ALGO NUEVO ESTÁ EN CAMINO
      </div>

      <h2>Próximamente<span class="accent">.</span></h2>

      <p class="description">
        Estamos construyendo experiencias digitales
        que transforman tus ideas en realidad.
      </p>

      <div class="services">
        <span>Páginas Web</span>
        <span class="separator">•</span>
        <span>Aplicaciones</span>
        <span class="separator">•</span>
        <span>Software</span>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> DevCode. Todos los derechos reservados.</p>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
