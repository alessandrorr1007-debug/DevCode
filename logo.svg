
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
  role="img"
  aria-labelledby="title"
>
  <title id="title">DevCode Logo</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202b52"/>
      <stop offset="100%" stop-color="#11182e"/>
    </linearGradient>

    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5a5ff"/>
      <stop offset="100%" stop-color="#697dff"/>
    </linearGradient>
  </defs>

  <rect
    x="3"
    y="3"
    width="94"
    height="94"
    rx="23"
    fill="url(#bg)"
    stroke="#3c4775"
